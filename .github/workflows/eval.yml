# PR이 프롬프트(또는 eval 엔진·데이터)를 바꾸면, PR의 프롬프트를 base 브랜치에 있는 같은 프롬프트와 비교하는 Eval을 돌리고
# 결과를 PR 코멘트로 남긴다. 점수가 기준보다 떨어지면 체크 실패(exit 1), eval 실행 자체가 실패해도 실패(exit 2).
# 새 버전(v3.txt 추가)이나 엔진만 바뀐 PR은 직전 버전 프롬프트를 기준으로 쓴다 (scripts/run_eval.py).
# 주의: 12케이스 LLM 채점은 노이즈가 커서 게이트는 한 케이스 분량의 허용 오차를 둔다 (evals/engine.py compare).
name: prompt-eval
on:
  pull_request:
    paths: ["evals/prompts/**", "evals/engine.py", "data/evals/**", "scripts/run_eval.py"]
permissions:
  contents: read
  pull-requests: write
concurrency:  # 같은 PR에 연달아 push하면 이전 실행(과 그 API 비용)을 취소
  group: prompt-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  eval:
    # 포크 PR에는 API 키 시크릿과 코멘트 쓰기 권한이 없으므로 건너뛴다
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # origin/<base> 와 비교하려면 전체 이력이 필요
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: eval
        run: python scripts/run_eval.py --baseline-ref "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
      - if: always() && hashFiles('eval-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with: { path: eval-report.md }
      - if: always() && hashFiles('eval-report.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval-report.json }
      - if: steps.eval.outcome == 'failure'
        run: exit 1
